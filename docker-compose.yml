version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: zenda-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zenda-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zenda-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - zenda-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: zenda-nats
    command: ["-js", "--require_signup", "--user", "${NATS_USER}", "--pass", "${NATS_PASSWORD}"]
    networks:
      - zenda-net
    ports:
      - "4222:4222"
      - "8222:8222"

  # ... resto de servicios con variables de entorno
networks:
  zenda-net:
    driver: bridge

volumes:
  postgres_data:
