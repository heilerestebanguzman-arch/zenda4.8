version: '3.8'

services:
  # ============================================
  # POSTGRESQL
  # ============================================
  postgres:
    image: postgis/postgis:15-3.4
    container_name: zenda-postgres
    environment:
      POSTGRES_USER: zenda_admin
      POSTGRES_PASSWORD: zenda_secure_pass_2026
      POSTGRES_DB: zenda
    ports:
      - "5432:5432"
    volumes:
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenda_admin -d zenda"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zenda-network

  # ============================================
  # REDIS (Caché)
  # ============================================
  redis:
    image: redis:7.2-alpine
    container_name: zenda-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zenda-network

  # ============================================
  # EMQX (MQTT Broker)
  # ============================================
  mqtt:
    image: emqx/emqx:5.3
    container_name: zenda-mqtt
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8084:8084"
    volumes:
      - emqx_data:/opt/emqx/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - zenda-network

  # ============================================
  # MÓDULO 1 - FLOTA
  # ============================================
  modulo-1-flota:
    build:
      context: ./modulo_1_flota
      dockerfile: Dockerfile
    container_name: zenda-modulo-1-flota
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: zenda
      DB_USER: zenda_admin
      DB_PASSWORD: zenda_secure_pass_2026
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MQTT_BROKER: tcp://mqtt:1883
      PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - zenda-network

networks:
  zenda-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  emqx_data:
